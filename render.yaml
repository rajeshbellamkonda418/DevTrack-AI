services:
  - type: web
    name: devtrack-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_BACKEND
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/devtrack-applications.sqlite3
