<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Sign in | DevTrack AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script defer src="{{ url_for('static', filename='js/auth.js') }}"></script>
</head>
<body>
    <main class="auth-page">
        <a class="auth-brand" href="/login">DevTrack<span>AI</span></a>
        <section class="auth-card" aria-labelledby="auth-title">
            <p class="auth-eyebrow">YOUR CAREER, ORGANIZED</p>
            <h1 id="auth-title">Welcome back</h1>
            <p id="auth-description" class="auth-description">Sign in to continue to your career workspace.</p>

            <form id="auth-form">
                <input id="auth-mode" type="hidden" value="login">
                <input id="next-url" type="hidden" value="{{ next_url }}">
                <label for="auth-name">Name</label>
                <input id="auth-name" name="name" type="text" autocomplete="username"
                    minlength="2" maxlength="80" required>

                <label for="auth-password">Password</label>
                <input id="auth-password" name="password" type="password"
                    autocomplete="current-password" minlength="8" maxlength="128" required>

                <button id="auth-submit" type="submit">Sign in</button>
                <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                <span id="auth-switch-prompt">New here?</span>
                <button id="auth-switch" class="auth-switch-button" type="button">Create an account</button>
            </p>
        </section>
        <p class="auth-credit">Developed by <strong>Rajesh</strong></p>
    </main>
</body>
</html>
